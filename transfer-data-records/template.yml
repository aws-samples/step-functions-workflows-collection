AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Resources:
  DynamoDBToSQSStateMachine:
        Type: AWS::Serverless::StateMachine
        Properties:
            DefinitionSubstitutions:
                ddbTableName: !Ref DDBTable
                sqsQueueUrl: !GetAtt SQSQueue.Arn
                seedingFunctionArn: !GetAtt SeedingFunction.Arn
            DefinitionUri: statemachine/statemachine.asl.json
            Role: !GetAtt DynamoDBToSQSExecutionRole.Arn
        Metadata:
            SamResourceId: DynamoDBToSQSStateMachine
  DynamoDBToSQSExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: states.amazonaws.com
          Action: sts:AssumeRole
      Path: /
      Policies:
      - PolicyName: DynamoDBAndSQSAccessPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            Resource:
            - Fn::GetAtt:
              - DDBTable
              - Arn
          - Effect: Allow
            Action:
            - sqs:SendMessage
            Resource:
            - Fn::GetAtt:
              - SQSQueue
              - Arn
          - Effect: Allow
            Action:
            - lambda:invokeFunction
            Resource:
            - Fn::GetAtt:
              - SeedingFunction
              - Arn
    Metadata:
      SamResourceId: DynamoDBToSQSExecutionRole
  DDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      ProvisionedThroughput:
        ReadCapacityUnits: '10'
        WriteCapacityUnits: '10'
      AttributeDefinitions:
      - AttributeName: MessageId
        AttributeType: S
      KeySchema:
      - AttributeName: MessageId
        KeyType: HASH
    Metadata:
      SamResourceId: DDBTable
  SQSQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
    Metadata:
      SamResourceId: SQSQueue
  SeedingFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role:
        Fn::GetAtt:
        - SeedingFunctionExecutionRole
        - Arn
      Code:
        ZipFile:
          Fn::Sub:
          - |
            console.log('Loading function');
            const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
            const { DynamoDBDocumentClient, PutCommand } = require('@aws-sdk/lib-dynamodb');

            const docClient = DynamoDBDocumentClient.from(new DynamoDBClient());

            exports.lambda_handler = async (event, context) => {
                var messageIds = [];
                var puts = [];

                for (var i = 0; i < 10; i++) {
                    console.log("Adding a new item...");
                    var messageId = "MessageNo" + i.toString();
                    messageIds.push(messageId);

                    var message = "Hi! This is message no " + i.toString();
                    var params = {
                        TableName: "${ddbTableName}",
                        Item: {
                            "MessageId": messageId,
                            "Message": message
                        }
                    };
                    puts.push(docClient.send(new PutCommand(params))
                        .then((data) => console.log("Added item:", JSON.stringify(data, null, 2)))
                        .catch((err) => console.error("Unable to add item. Error JSON:", JSON.stringify(err, null, 2))));
                }
                await Promise.all(puts);
                messageIds.push("DONE");
                return messageIds;
            };
          - ddbTableName:
              Ref: DDBTable
      Runtime: nodejs24.x
      Timeout: '60'
    Metadata:
      SamResourceId: SeedingFunction
  SeedingFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: SeedingFunctionExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:PutItem
            Resource:
              Fn::GetAtt:
              - DDBTable
              - Arn
    Metadata:
      SamResourceId: SeedingFunctionExecutionRole
Outputs:
  StateMachineArn:
    Value:
      Ref: DynamoDBToSQSStateMachine
  ExecutionInput:
    Description: Sample input to StartExecution.
    Value: '{}
      '